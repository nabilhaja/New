services:
  - type: web
    name: bip-mcp-server
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: BIP_ENV
        value: sandbox
      - key: BIP_CLIENT_ID
        sync: false
      - key: BIP_CLIENT_SECRET
        sync: false
      - key: BIP_SCOPE
        value: "OPENAPI_NOTICES OPENAPI_AWARDS OPENAPI_SPEND"
